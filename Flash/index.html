<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP Web Flasher</title>
<script src="https://cdn.jsdelivr.net/gh/espressif/web-flasher@main/web-flasher.js"></script>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f2f5;
    color: #2f3640;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px;
  }

  h2 { color: #e84118; position: relative; }

  /* 3-dot menu */
  .menu {
    position: absolute;
    top: 10px;
    right: 10px;
  }
  .menu-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
  }
  .menu-content {
    display: none;
    position: absolute;
    right: 0;
    background: white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    border-radius: 5px;
    overflow: hidden;
    z-index: 10;
  }
  .menu-content button {
    background: white;
    border: none;
    padding: 10px 20px;
    width: 100%;
    text-align: left;
    cursor: pointer;
  }
  .menu-content button:hover {
    background: #f0f0f0;
  }

  .card {
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 600px;
    margin-bottom: 20px;
  }

  button {
    padding: 8px 18px;
    margin: 5px;
    background-color: #0097e6;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover { background-color: #00a8ff; }

  select, input[type="file"], input[type="text"] {
    margin: 8px 0;
    padding: 6px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  #log {
    border: 1px solid #ccc;
    padding: 10px;
    height: 200px;
    overflow: auto;
    background: #f7f9fb;
    border-radius: 5px;
    white-space: pre-wrap;
  }

  .file-entry {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .file-entry input[type="text"] { width: 120px; }

  .delete-btn {
    background-color: #e84118;
  }
  .delete-btn:hover { background-color: #ff4d4d; }
</style>
</head>
<body>

<h2>ESP Web Flasher
  <div class="menu">
    <button class="menu-btn">⋮</button>
    <div class="menu-content" id="menu-content">
      <button id="hid-flash">ESP32 BLE HID Flash</button>
    </div>
  </div>
</h2>

<div class="card">
  <button id="connect">Connect to Board</button>
  <div style="margin-top:10px;">
    <label>Select Board:</label>
    <select id="board">
      <option value="esp32">ESP32</option>
      <option value="esp32s2">ESP32-S2</option>
      <option value="esp32c3">ESP32-C3</option>
      <option value="esp8266">ESP8266</option>
    </select>
  </div>
  <div id="board-info" style="margin-top:10px;"></div>
</div>

<div class="card" id="files-card" style="display:none;">
  <h3>Bin Files</h3>
  <div id="files-container">
    <div class="file-entry">
      <input type="file" class="file" accept=".bin" />
      <input type="text" class="address" value="0x1000" />
      <button class="delete-btn">🗑️</button>
    </div>
    <div class="file-entry">
      <input type="file" class="file" accept=".bin" />
      <input type="text" class="address" value="0x8000" />
      <button class="delete-btn">🗑️</button>
    </div>
    <div class="file-entry">
      <input type="file" class="file" accept=".bin" />
      <input type="text" class="address" value="0x10000" />
      <button class="delete-btn">🗑️</button>
    </div>
  </div>
  <button id="add-file">➕ Add Another Bin</button>
  <br>
  <button id="erase">Erase Flash</button>
  <button id="flash">Flash Files</button>
</div>

<pre id="log" class="card"></pre>

<script>
let port;
let filesData = [];

// Logging
function log(msg){
  const pre = document.getElementById('log');
  pre.textContent += msg + "\n";
  pre.scrollTop = pre.scrollHeight;
}

// Menu toggle
document.querySelector('.menu-btn').addEventListener('click', () => {
  const menu = document.getElementById('menu-content');
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
});

// Connect
document.getElementById('connect').addEventListener('click', async () => {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    document.getElementById('board-info').innerHTML = "✅ Connected to ESP board!";
    document.getElementById('files-card').style.display = "block";
    log("Connected to board successfully.");
  } catch (err) {
    log("❌ Connection failed: " + err);
  }
});

// Add & delete buttons
document.getElementById('add-file').addEventListener('click', () => {
  const container = document.getElementById('files-container');
  const div = document.createElement('div');
  div.className = 'file-entry';
  div.innerHTML = `<input type="file" class="file" accept=".bin" />
                   <input type="text" class="address" placeholder="0x10000" />
                   <button class="delete-btn">🗑️</button>`;
  container.appendChild(div);
  attachDelete(div);
});
function attachDelete(div){ div.querySelector('.delete-btn').addEventListener('click', ()=>div.remove()); }
document.querySelectorAll('.file-entry').forEach(attachDelete);

// Flash manually selected files
document.getElementById('flash').addEventListener('click', async () => {
  if(!port){ log("⚠️ Connect to board first."); return; }

  const board = document.getElementById('board').value;
  const entries = document.querySelectorAll('.file-entry');
  filesData = [];

  if(board === "esp8266" && entries.length > 1){
    log("⚠️ ESP8266 supports only 1 file. Extra files will be ignored.");
  }

  for(const entry of entries){
    const fileInput = entry.querySelector('.file');
    const addrInput = entry.querySelector('.address');
    const file = fileInput.files[0];
    const addr = addrInput.value.trim();
    if(file && addr){
      const reader = new FileReader();
      await new Promise((res, rej) => {
        reader.onload = () => {
          filesData.push({ data: new Uint8Array(reader.result), address: addr });
          log(`📂 File ready: ${file.name} at ${addr}`);
          res();
        }
        reader.onerror = () => rej("File read error");
        reader.readAsArrayBuffer(file);
      });
    }
  }

  if(board === "esp8266" && filesData.length > 1){
    filesData = [filesData[0]];
  }

  if(filesData.length === 0){ log("⚠️ No files selected."); return; }

  log("⚡ Flashing started...");
  try {
    for(const f of filesData){
      if(board === "esp8266"){
        await webFlasher.flashESP8266(port, f.data, parseInt(f.address,16));
        log(`✅ ESP8266 Flashed ${f.address}`);
      } else {
        await webFlasher.flashESP32(port, f.data, parseInt(f.address,16));
        log(`✅ ESP32 Flashed ${f.address}`);
      }
    }
    log("🎉 Flashing complete!");
    await port.close();
  } catch(err){ log("❌ Flash failed: " + err); }
});

// Erase
document.getElementById('erase').addEventListener('click', async () => {
  if(!port){ log("⚠️ Connect to board first."); return; }
  try {
    log("🧹 Erasing flash...");
    await webFlasher.eraseFlash(port);
    log("✅ Flash erased!");
  } catch(err){ log("❌ Erase failed: " + err); }
});

// Inbuilt ESP32 BLE HID Flash
document.getElementById('hid-flash').addEventListener('click', async () => {
  const urls = [
    "https://example.com/bootloader.bin",
    "https://example.com/partitions.bin",
    "https://example.com/app.bin"
  ];
  const addresses = [ "0x1000", "0x8000", "0x10000" ];

  try {
    if(!port){
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      log("✅ Connected to ESP32 board.");
    }

    log("⚡ Starting ESP32 BLE HID flashing...");

    for(let i=0; i<urls.length; i++){
      const resp = await fetch(urls[i]);
      const data = new Uint8Array(await resp.arrayBuffer());
      await webFlasher.flashESP32(port, data, parseInt(addresses[i], 16));
      log(`✅ Flashed ${urls[i]} at ${addresses[i]}`);
    }

    log("🎉 ESP32 BLE HID Flash complete!");
    await port.close();
  } catch(err){
    log("❌ HID Flash failed: " + err);
  }
});
</script>

</body>
</html>
